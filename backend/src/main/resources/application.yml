spring:
  application:
    name: duck-store

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duck_store}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Postgres@123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.yash.duckstore: INFO
